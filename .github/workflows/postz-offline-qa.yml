name: POSTZ - Offline Clipping Safety QA

# Deliberately manual-only. It never starts on push, builds a container,
# downloads model weights, performs database migrations, or publishes posts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postz-offline-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout the selected branch
        uses: actions/checkout@v4

      - name: Node.js 22 for built-in test runner
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify runtime inspection script syntax
        run: node --check tools/local-clipper/preflight.mjs

      - name: Offline clipping safety, worker preflight, and Temporal error tests
        run: |
          node --experimental-strip-types --test \
            tools/local-clipper/tests/local-clipping-safety.test.mjs \
            tools/local-clipper/tests/preflight.test.mjs \
            tools/local-clipper/tests/local-clipping-outcome.test.mjs
